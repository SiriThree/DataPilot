dataset:
  root_path: data/public/input

agent:
  provider: ollama
  model: ${OLLAMA_MODEL:-qwen3:8b}
  api_base: ${OLLAMA_API_BASE:-http://localhost:11434}
  api_key:
  max_steps: 24
  temperature: 0.0
  use_multi_agent: true

run:
  output_dir: artifacts/runs
  run_id:
  max_workers: 2
  task_timeout_seconds: 360
  enable_guided_retry: false
